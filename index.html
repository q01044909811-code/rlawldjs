<html lang="ko"><head>
  

  <meta charset="UTF-8">

  <meta property="og:title" content="EcoLab — Explore. Analyze. Innovate.">
  <meta property="og:description" content="Explore. Analyze. Innovate. AI 기반 환경 과학·데이터 분석 및 친환경 소재 탐구 플랫폼">
  <meta property="og:type" content="website">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@500;600;700&amp;display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-canvas: #F6F8F7;
      --bg-surface: #FFFFFF;
      --bg-subtle: #F1F5F3;
      --bg-obsidian: #0B0F0E;
      --bg-forest: #0B1F17;
      --accent-green: #064E3B;
      --accent-green-hover: #053D2E;
      --accent-emerald: #10B981;
      --text-primary: #0F172A;
      --text-secondary: #475569;
      --text-muted: #64748B;
      --border-hairline: #E2E8F0;
      --amber-bg: #FFFBEB;
      --amber-border: #FCD34D;
      --amber-text: #78350F;
      --red-bg: #FEF2F2;
      --red-border: #FECACA;
      --red-text: #991B1B;
      --font-sans: "Pretendard", "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font-display: "Plus Jakarta Sans", "Pretendard", sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      --radius-md: 8px;
      --radius-lg: 12px;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { font-family: var(--font-sans); scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--bg-canvas);
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
      line-height: 1.5;
    }
    h1, h2, h3, h4 { margin: 0; font-family: var(--font-display); }
    p { margin: 0; }
    button, input, select, textarea { font-family: inherit; }
    button { cursor: pointer; }
    .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

    /* Layout Shell */
    .app-shell { display: flex; min-height: 100vh; }
    .sidebar {
      width: 256px;
      background: var(--bg-obsidian);
      color: #fff;
      position: fixed;
      inset: 0 auto 0 0;
      display: flex;
      flex-direction: column;
      border-right: 1px solid rgba(255,255,255,0.08);
      z-index: 30;
    }
    .sidebar-brand {
      padding: 22px 24px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .sidebar-brand button {
      background: none;
      border: none;
      padding: 0;
      text-align: left;
      color: #fff;
    }
    .brand-title { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; display: block; }
    .brand-slogan { font-size: 12px; color: #6EE7B7; margin-top: 3px; display: block; }

    .sidebar-nav { flex: 1; padding: 16px 12px; display: flex; flex-direction: column; gap: 4px; overflow-y: auto; }
    .nav-btn {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border-radius: var(--radius-md);
      border: none;
      background: transparent;
      color: #CBD5E1;
      text-align: left;
      transition: background 150ms ease, color 150ms ease;
    }
    .nav-btn:hover { background: rgba(255,255,255,0.06); color: #fff; }
    .nav-btn.active { background: var(--accent-green); color: #fff; }
    .nav-btn svg { width: 17px; height: 17px; flex-shrink: 0; }
    .nav-label-ko { display: block; font-size: 13.5px; font-weight: 500; line-height: 1.25; }
    .nav-label-en { display: block; font-size: 11px; color: #94A3B8; margin-top: 2px; }
    .nav-btn.active .nav-label-en { color: #A7F3D0; }
    .nav-count { margin-left: auto; font-size: 12px; color: #6EE7B7; }

    .sidebar-context {
      padding: 16px;
      background: #070A09;
      border-top: 1px solid rgba(255,255,255,0.08);
      font-size: 12px;
      color: #94A3B8;
    }
    .sidebar-context-title { font-weight: 600; color: #E2E8F0; margin-bottom: 8px; }
    .sidebar-context-row { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 4px; }
    .sidebar-context-row span { color: #F1F5F9; }

    .main-wrap {
      flex: 1;
      margin-left: 256px;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      height: 56px;
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border-hairline);
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .mobile-menu-btn {
      display: none;
      background: none;
      border: 1px solid var(--border-hairline);
      border-radius: 6px;
      padding: 6px 8px;
      color: var(--text-primary);
    }
    .topbar-title { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .topbar-sub { font-size: 12px; color: var(--text-muted); white-space: nowrap; }

    .content-area {
      width: 100%;
      max-width: 1280px;
      margin: 0 auto;
      padding: 28px 24px 48px;
    }

    /* Buttons & Inputs */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: var(--radius-md);
      font-size: 12.5px;
      font-weight: 500;
      border: 1px solid transparent;
      white-space: nowrap;
      flex-shrink: 0;
      transition: background 150ms ease, border-color 150ms ease, color 150ms ease;
    }
    .btn-primary { background: var(--accent-green); color: #fff; }
    .btn-primary:hover { background: var(--accent-green-hover); }
    .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-emerald { background: var(--accent-emerald); color: #05261A; font-weight: 600; }
    .btn-emerald:hover { background: #34D399; }
    .btn-secondary { background: #fff; border-color: var(--border-hairline); color: var(--text-primary); }
    .btn-secondary:hover { background: #F8FAFC; }
    .btn-danger { background: #DC2626; color: #fff; }
    .btn-danger:hover { background: #B91C1C; }
    .btn-sm { padding: 6px 12px; font-size: 12px; }

    .input, .select, .textarea {
      width: 100%;
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-md);
      background: #fff;
      color: var(--text-primary);
      padding: 8px 12px;
      font-size: 13.5px;
      outline: none;
    }
    .input:focus, .select:focus, .textarea:focus { border-color: var(--accent-green); }

    /* Cards & Grids */
    .card {
      background: var(--bg-surface);
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-lg);
      padding: 20px;
    }
    .section-gap { display: flex; flex-direction: column; gap: 24px; }
    .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
    .grid-5 { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 14px; }
    .split-layout { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 24px; align-items: start; }

    /* Segmented Filter Controls */
    .filter-bar { display: flex; flex-wrap: wrap; gap: 6px; }
    .filter-btn {
      padding: 6px 12px;
      border-radius: var(--radius-md);
      border: none;
      background: #F1F5F9;
      color: #334155;
      font-size: 12px;
      font-weight: 500;
      white-space: nowrap;
    }
    .filter-btn:hover { background: #E2E8F0; }
    .filter-btn.active { background: var(--accent-green); color: #fff; }

    .segmented {
      display: inline-flex;
      background: #F1F5F9;
      padding: 3px;
      border-radius: var(--radius-md);
      gap: 2px;
    }
    .seg-btn {
      border: none;
      background: transparent;
      color: #475569;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      white-space: nowrap;
    }
    .seg-btn.active { background: #fff; color: #0F172A; box-shadow: 0 1px 2px rgba(0,0,0,0.06); }

    /* Banners */
    .banner {
      border-radius: var(--radius-lg);
      padding: 12px 16px;
      font-size: 12.5px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .banner-verified { background: #ECFDF5; border: 1px solid #A7F3D0; color: #064E3B; }
    .banner-demo { background: var(--amber-bg); border: 1px solid var(--amber-border); color: var(--amber-text); }
    .banner-error { background: var(--red-bg); border: 1px solid var(--red-border); color: var(--red-text); }

    /* Hero */
    .hero-grid { display: grid; grid-template-columns: 1.35fr 1fr; gap: 20px; align-items: stretch; }
    .hero-main {
      background: var(--bg-forest);
      color: #fff;
      border-radius: var(--radius-lg);
      padding: 30px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 1px solid #064E3B;
    }
    .hero-title { font-size: clamp(24px, 3vw, 34px); font-weight: 700; line-height: 1.25; margin-top: 10px; text-wrap: balance; }
    .hero-desc { margin-top: 14px; font-size: 14.5px; color: #CBD5E1; line-height: 1.65; max-width: 58ch; }
    .hero-form { margin-top: 24px; display: flex; gap: 10px; }
    .hero-input {
      flex: 1;
      border-radius: var(--radius-md);
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.08);
      color: #fff;
      padding: 10px 14px;
      font-size: 13.5px;
      outline: none;
    }
    .hero-input::placeholder { color: #94A3B8; }
    .hero-input:focus { border-color: #34D399; }
    .hero-visual {
      background: var(--bg-forest);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-hairline);
      overflow: hidden;
      position: relative;
      min-height: 250px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }
    .hero-visual svg { position: absolute; inset: 0; width: 100%; height: 100%; }
    .hero-visual-caption {
      position: relative;
      z-index: 2;
      padding: 18px 20px;
      background: linear-gradient(to top, rgba(7,15,12,0.92), rgba(7,15,12,0.35), transparent);
      color: #fff;
    }

    /* Tables */
    .table-wrap { overflow-x: auto; border: 1px solid var(--border-hairline); border-radius: var(--radius-lg); background: #fff; }
    table { width: 100%; border-collapse: collapse; font-size: 12.5px; text-align: left; }
    th { background: #F8FAFC; color: #475569; font-weight: 600; padding: 11px 14px; border-bottom: 1px solid var(--border-hairline); }
    td { padding: 11px 14px; border-bottom: 1px solid #F1F5F9; vertical-align: top; color: #1E293B; }
    tr:last-child td { border-bottom: none; }

    /* List Item Selection */
    .list-item {
      width: 100%;
      text-align: left;
      background: #fff;
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-lg);
      padding: 16px;
      transition: border-color 150ms ease, background 150ms ease;
    }
    .list-item:hover { border-color: var(--accent-green); }
    .list-item.active { background: var(--bg-forest); border-color: var(--accent-green); color: #fff; }
    .list-item.active .meta-text { color: #6EE7B7; }
    .list-item.active .sub-text { color: #CBD5E1; }

    .meta-text { font-size: 11.5px; color: var(--text-muted); }
    .sub-text { font-size: 12.5px; color: var(--text-secondary); margin-top: 6px; line-height: 1.5; }

    /* Material Cards & Floating Tray */
    .mat-visual { aspect-ratio: 4/3; background: #0B1F17; border-bottom: 1px solid var(--border-hairline); overflow: hidden; }
    .mat-visual svg { width: 100%; height: 100%; display: block; }
    .compare-tray {
      position: sticky;
      bottom: 16px;
      z-index: 25;
      background: var(--bg-forest);
      color: #fff;
      border: 1px solid #065F46;
      border-radius: var(--radius-lg);
      padding: 12px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      box-shadow: 0 12px 28px rgba(0,0,0,0.22);
    }

    /* Modals & Drawers */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 60;
      background: rgba(0,0,0,0.52);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-box {
      width: 100%;
      max-width: 500px;
      background: #fff;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-hairline);
      padding: 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
      max-height: 90vh;
      overflow-y: auto;
    }
    .drawer-backdrop {
      position: fixed;
      inset: 0;
      z-index: 60;
      background: rgba(0,0,0,0.52);
      display: flex;
      justify-content: flex-end;
    }
    .drawer-panel {
      width: 100%;
      max-width: 660px;
      height: 100%;
      background: #fff;
      overflow-y: auto;
      padding: 28px;
      box-shadow: -12px 0 32px rgba(0,0,0,0.18);
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 70;
      background: var(--bg-forest);
      color: #fff;
      border: 1px solid #065F46;
      padding: 12px 16px;
      border-radius: var(--radius-md);
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    /* Mobile Bottom Bar */
    .mobile-bottom-nav {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 56px;
      background: #fff;
      border-top: 1px solid var(--border-hairline);
      z-index: 40;
      grid-template-columns: repeat(5, 1fr);
    }
    .mobile-tab {
      border: none;
      background: transparent;
      color: #64748B;
      font-size: 11px;
      font-weight: 500;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      min-height: 44px;
    }
    .mobile-tab.active { color: var(--accent-green); font-weight: 600; }

    /* Responsive Breakpoints */
    @media (max-width: 1080px) {
      .grid-5 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .hero-grid { grid-template-columns: 1fr; }
      .split-layout { grid-template-columns: 1fr; }
    }
    @media (max-width: 900px) {
      .sidebar { display: none; }
      .sidebar.mobile-open { display: flex; width: 270px; box-shadow: 12px 0 32px rgba(0,0,0,0.35); }
      .main-wrap { margin-left: 0; padding-bottom: 64px; }
      .mobile-menu-btn { display: inline-flex; }
      .mobile-bottom-nav { display: grid; }
      .grid-3, .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 640px) {
      .grid-2, .grid-3, .grid-4, .grid-5 { grid-template-columns: 1fr; }
      .hero-form { flex-direction: column; }
      .content-area { padding: 18px 14px 36px; }
      .topbar { padding: 0 14px; }
      .compare-tray { bottom: 64px; }
      .toast { bottom: 68px; right: 14px; left: 14px; }
    }
  </style>

<body>
  <div class="app-shell">
    <!-- Left Sidebar -->
    <aside id="sidebar" class="sidebar" aria-label="주 메뉴">
      <div class="sidebar-brand">
        <button type="button" onclick="navigateTo('home')">
          <span class="brand-title">EcoLab</span>
          <span class="brand-slogan">Explore. Analyze. Innovate.</span>
        </button>
      </div>
      <nav id="sidebar-nav" class="sidebar-nav"></nav>
      <div id="sidebar-context" class="sidebar-context"></div>
    </aside>

    <!-- Main Content -->
    <div class="main-wrap">
      <header class="topbar">
        <div class="topbar-left">
          <button type="button" class="mobile-menu-btn" onclick="toggleMobileSidebar()" aria-label="메뉴 열기">☰</button>
          <span id="topbar-title" class="topbar-title">홈 대시보드</span>
          <span id="topbar-sub" class="topbar-sub">· Home</span>
        </div>
        <button type="button" id="topbar-cta" class="btn btn-primary btn-sm" onclick="handleTopbarAction()">AI 해결 연구실 열기</button>
      </header>

      <main id="app-content" class="content-area"></main>
    </div>
  </div>

  <!-- Mobile Bottom Navigation -->
  <nav id="mobile-bottom-nav" class="mobile-bottom-nav" aria-label="모바일 빠른 이동"></nav>

  <!-- Modal Containers -->
  <div id="modal-root"></div>
  <div id="drawer-root"></div>
  <div id="toast-root"></div>

  <script>
    // =========================================================================
    // 1. STATIC SCIENTIFIC DATA (ENVIRONMENT TOPICS, DATASETS, 6 ECO-MATERIALS)
    // =========================================================================
    const ENV_CATEGORY_LABELS = {
      climate: '기후변화 및 온실가스',
      air: '대기오염 및 미세먼지',
      water: '수질오염 및 미세플라스틱',
      waste: '폐기물 및 자원 순환',
      energy: '에너지 문제'
    };

    const ENVIRONMENT_TOPICS = [
      {
        id: 'climate-greenhouse-warming',

    function calculateStats(points) {
      if (!points || points.length === 0) {
        return { count: 0, mean: 0, min: { value: 0, label: '-' }, max: { value: 0, label: '-' }, changeRatePercent: null, absoluteChange: 0, correlation: null };
      }
      let sum = 0;
      let minPt = points[0];
      let maxPt = points[0];
      points.forEach(p => {
        sum += p.value;
        if (p.value < minPt.value) minPt = p;
        if (p.value > maxPt.value) maxPt = p;
      });
      const first = points[0].value;
      const last = points[points.length - 1].value;
      const absoluteChange = last - first;
      const changeRatePercent = first === 0 ? null : ((last - first) / Math.abs(first)) * 100;

      let correlation = null;
      const paired = points.filter(p => typeof p.secondaryValue === 'number' && Number.isFinite(p.secondaryValue));
      if (paired.length >= 3) {
        const n = paired.length;
        const mx = paired.reduce((a, b) => a + b.value, 0) / n;
        const my = paired.reduce((a, b) => a + b.secondaryValue, 0) / n;
        let num = 0, dx2 = 0, dy2 = 0;
        paired.forEach(p => {
          const dx = p.value - mx;
          const dy = p.secondaryValue - my;
          num += dx * dy; dx2 += dx * dx; dy2 += dy * dy;
        });
        const den = Math.sqrt(dx2 * dy2);
        correlation = den === 0 ? null : num / den;
      }
      return { count: points.length, mean: sum / points.length, min: minPt, max: maxPt, changeRatePercent, absoluteChange, correlation };
    }

    function fmtNum(v, dec = 2) {
      if (!Number.isFinite(v)) return '-';
      if (Math.abs(v) >= 1000) return v.toLocaleString('ko-KR', { maximumFractionDigits: 1 });
      return v.toLocaleString('ko-KR', { minimumFractionDigits: Number.isInteger(v) ? 0 : Math.min(dec, 2), maximumFractionDigits: dec });
    }

    function splitCsvLine(line) {
      const cells = [];
      let cur = '', inQ = false;
      for (let i = 0; i < line.length; i++) {
        const ch = line[i];
        if (ch === '"') {
          if (inQ && line[i + 1] === '"') { cur += '"'; i++; }
          else inQ = !inQ;
        } else if (ch === ',' && !inQ) {
          cells.push(cur.trim()); cur = '';
        } else cur += ch;
      }
      cells.push(cur.trim());
      return cells;
    }

    function parseCsvText(raw) {
      const cleaned = raw.replace(/^\uFEFF/, '').trim();
      if (!cleaned) throw new Error('CSV 파일 내용이 비어 있습니다.');
      const lines = cleaned.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
      if (lines.length < 3) throw new Error('헤더와 최소 2개 이상의 데이터 행이 필요합니다.');
      const headers = splitCsvLine(lines[0]).map((h, i) => h || `col_${i + 1}`);
      if (headers.length < 2) throw new Error('최소 2개 이상의 컬럼이 필요합니다.');
      const rows = [];
      for (let i = 1; i < lines.length; i++) {
        const vals = splitCsvLine(lines[i]);
        if (vals.every(v => v === '')) continue;
        const row = {};
        headers.forEach((h, idx) => { row[h] = vals[idx] || ''; });
        rows.push(row);
      }
      if (rows.length < 2) throw new Error('유효한 데이터 행이 최소 2개 이상 필요합니다.');
      const numericColumns = headers.filter(h => {
        let valid = 0;
        rows.forEach(r => {
          const num = Number((r[h] || '').replace(/,/g, ''));
          if ((r[h] || '') !== '' && Number.isFinite(num)) valid++;
        });
        return valid >= Math.max(2, Math.floor(rows.length * 0.6));
      });
      if (numericColumns.length === 0) throw new Error('그래프로 그릴 수 있는 수치형 컬럼을 찾지 못했습니다.');
      return { headers, rows, numericColumns };
    }

    function renderExplorerKeepFocus(inputEl) {

    function askTopicQuestionInAi(topicId, qIdx) {
      const topic = ENVIRONMENT_TOPICS.find(t => t.id === topicId);
      if (!topic) return;
      state.activeTopicId = topic.id;
      state.aiQuery = topic.inquiryQuestions[qIdx] || '';
      navigateTo('ai-lab');
    }

    // -------------------------------------------------------------------------
    // MODULE 2: DATA LAB (CHARTS, STATS, CSV UPLOAD, AI INTERPRETATION)
    // -------------------------------------------------------------------------
    function getDataLabContext() {
      if (state.dataSourceMode === 'csv' && state.csvParsed && state.csvYCol) {
        const rawPts = [];
        state.csvParsed.rows.forEach(r => {
          const v = Number((r[state.csvYCol] || '').replace(/,/g, ''));
          if (!Number.isFinite(v)) return;
          const sv = state.csvCompareCol !== 'none' ? Number((r[state.csvCompareCol] || '').replace(/,/g, '')) : NaN;
          rawPts.push({ label: r[state.csvXCol] || `#${rawPts.length+1}`, value: v, secondaryValue: Number.isFinite(sv) ? sv : undefined });
        });
        const sIdx = Math.max(0, Math.min(state.startIdx, Math.max(0, rawPts.length - 2)));
        const eIdx = Math.min(rawPts.length - 1, Math.max(sIdx + 1, state.endIdx));
        return {
          points: rawPts.slice(sIdx, eIdx + 1),
          allLabels: rawPts.map(p => p.label),
          title: state.csvYCol,
          unit: '단위(CSV)',
          secTitle: state.csvCompareCol !== 'none' ? state.csvCompareCol : null,
          secUnit: '단위(CSV)',
          reliability: 'user_csv',
          sourceName: `사용자 업로드 CSV (${state.csvFileName})`,
          description: `업로드된 CSV에서 ${rawPts.length}행 중 ${eIdx - sIdx + 1}개 구간을 분석 중입니다.`
        };
      }
      const ds = ENVIRONMENTAL_DATASETS.find(d => d.id === state.activeDatasetId) || ENVIRONMENTAL_DATASETS[0];
      const comp = state.compareDatasetId !== 'none' ? ENVIRONMENTAL_DATASETS.find(d => d.id === state.compareDatasetId) : null;
      const sIdx = Math.max(0, Math.min(state.startIdx, Math.max(0, ds.points.length - 2)));
      const eIdx = Math.min(ds.points.length - 1, Math.max(sIdx + 1, state.endIdx));
      const sliced = ds.points.slice(sIdx, eIdx + 1).map(p => {
        if (!comp) return { ...p };
        const m = comp.points.find(cp => cp.label === p.label);
        return { ...p, secondaryValue: m ? m.value : undefined };
      });
      return {
        points: sliced,
        allLabels: ds.points.map(p => p.label),
        title: ds.title,
        unit: ds.unit,
        secTitle: comp ? comp.title : null,
        secUnit: comp ? comp.unit : null,
        reliability: ds.reliability,
        sourceName: ds.sourceName,
        description: ds.description
      };
    }

    function renderSvgChart(ctx) {
      const pts = ctx.points;
      if (!pts || pts.length < 2) return '<div style="padding:40px;text-align:center;color:#64748B;">표시할 데이터가 부족합니다.</div>';
      const hasSec = pts.some(p => typeof p.secondaryValue === 'number' && Number.isFinite(p.secondaryValue));
      const W = 780, H = 310, padL = 56, padR = (hasSec && !state.normalizeCompare) ? 56 : 24, padT = 20, padB = 40;
      const plotW = W - padL - padR, plotH = H - padT - padB;

      const vals = pts.map(p => p.value);
      let pMin = Math.min(...vals), pMax = Math.max(...vals);
      const rawPMin = pMin, rawPMax = pMax;
      if (pMin === pMax) { pMin -= 1; pMax += 1; }
      else { const m = (pMax - pMin) * 0.12; pMin = (state.chartType === 'bar' && pMin >= 0) ? 0 : pMin - m; pMax += m; }

      const sVals = pts.map(p => p.secondaryValue).filter(v => typeof v === 'number');
      let sMin = sVals.length ? Math.min(...sVals) : 0, sMax = sVals.length ? Math.max(...sVals) : 1;
      const rawSMin = sMin, rawSMax = sMax;
      if (sMin === sMax) { sMin -= 1; sMax += 1; }
      else { const m2 = (sMax - sMin) * 0.12; sMin = (state.chartType === 'bar' && sMin >= 0) ? 0 : sMin - m2; sMax += m2; }

      const getX = idx => state.chartType === 'bar' ? padL + (plotW / pts.length) * idx + (plotW / pts.length) / 2 : padL + (idx / (pts.length - 1)) * plotW;
      const getY1 = v => state.normalizeCompare ? padT + (1 - (v - rawPMin) / (rawPMax - rawPMin || 1)) * plotH : padT + (1 - (v - pMin) / (pMax - pMin || 1)) * plotH;
      const getY2 = v => state.normalizeCompare ? padT + (1 - (v - rawSMin) / (rawSMax - rawSMin || 1)) * plotH : padT + (1 - (v - sMin) / (sMax - sMin || 1)) * plotH;

      const ticks = [0, 0.25, 0.5, 0.75, 1];
      const step = Math.max(1, Math.ceil(pts.length / 7));

      let shapes = '';
      if (state.chartType === 'bar') {
        const slot = plotW / pts.length;
        const bw = Math.min(34, slot * 0.65);
        const sw = hasSec ? bw * 0.46 : bw;
        shapes = pts.map((p, i) => {
          const x1 = getX(i) - (hasSec ? bw / 2 : sw / 2);
          const y1 = getY1(p.value), h1 = Math.max(2, padT + plotH - y1);
          let secRect = '';
          if (hasSec && typeof p.secondaryValue === 'number') {
            const y2 = getY2(p.secondaryValue), h2 = Math.max(2, padT + plotH - y2);
            secRect = `<rect x="${x1 + sw + 2}" y="${y2}" width="${sw}" height="${h2}" rx="2" fill="#D97706"/>`;
          }
          return `<rect x="${x1}" y="${y1}" width="${sw}" height="${h1}" rx="2" fill="#065F46"/>${secRect}`;
        }).join('');
      } else {
        const d1 = pts.map((p, i) => `${i===0?'M':'L'} ${getX(i).toFixed(1)} ${getY1(p.value).toFixed(1)}`).join(' ');
        let d2 = '';
        if (hasSec) {
          pts.forEach((p, i) => {
            if (typeof p.secondaryValue !== 'number') return;
            d2 += `${d2 === '' ? 'M' : 'L'} ${getX(i).toFixed(1)} ${getY2(p.secondaryValue).toFixed(1)} `;
          });
        }
        const dots = pts.map((p, i) => {
          let sDot = '';
          if (hasSec && typeof p.secondaryValue === 'number') {
            sDot = `<circle cx="${getX(i)}" cy="${getY2(p.secondaryValue)}" r="3.5" fill="#D97706" stroke="#fff" stroke-width="1.5"/>`;
          }
          return `<circle cx="${getX(i)}" cy="${getY1(p.value)}" r="3.5" fill="#065F46" stroke="#fff" stroke-width="1.5"/>${sDot}`;
        }).join('');
        shapes = `<path d="${d1}" fill="none" stroke="#065F46" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                  ${d2 ? `<path d="${d2}" fill="none" stroke="#D97706" stroke-width="2" stroke-dasharray="6 4" stroke-linecap="round"/>` : ''}
                  ${dots}`;
      }

      return `
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:10px;font-size:12px;">
          <div style="display:flex;gap:16px;flex-wrap:wrap;">
            <span><span style="display:inline-block;width:16px;height:4px;background:#065F46;vertical-align:middle;margin-right:6px;"></span><strong>${escapeHtml(ctx.title)}</strong> (${state.normalizeCompare ? '0–100 정규화' : escapeHtml(ctx.unit)})</span>
            ${hasSec && ctx.secTitle ? `<span><span style="display:inline-block;width:16px;border-top:2px dashed #D97706;vertical-align:middle;margin-right:6px;"></span><strong>${escapeHtml(ctx.secTitle)}</strong> (${state.normalizeCompare ? '0–100 정규화' : escapeHtml(ctx.secUnit)})</span>` : ''}
          </div>
          <div id="chart-hover-hud" class="mono" style="background:#F1F5F9;padding:4px 10px;border-radius:6px;color:#334155;">그래프 위에 마우스를 올리면 수치가 표시됩니다</div>
        </div>
        <svg id="ecolab-chart-svg" viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;cursor:crosshair;display:block;" onmousemove="handleChartHover(event)" onmouseleave="document.getElementById('chart-crosshair').style.display='none';">
          ${ticks.map(t => {
            const y = padT + (1 - t) * plotH;
            const v1 = state.normalizeCompare ? t * 100 : pMin + t * (pMax - pMin);
            const v2 = state.normalizeCompare ? t * 100 : sMin + t * (sMax - sMin);
            return `
              <line x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}" stroke="#E2E8F0" stroke-width="1"/>
              <text x="${padL - 8}" y="${y + 4}" text-anchor="end" fill="#64748B" font-size="10" font-family="monospace">${state.normalizeCompare ? Math.round(v1) + '%' : fmtNum(v1, 1)}</text>
              ${hasSec && !state.normalizeCompare ? `<text x="${W - padR + 8}" y="${y + 4}" text-anchor="start" fill="#B45309" font-size="10" font-family="monospace">${fmtNum(v2, 1)}</text>` : ''}
            `;
          }).join('')}
          <line x1="${padL}" y1="${padT + plotH}" x2="${W - padR}" y2="${padT + plotH}" stroke="#CBD5E1" stroke-width="1"/>
          ${pts.map((p, i) => (i % step === 0 || i === pts.length - 1) ? `<text x="${getX(i)}" y="${padT + plotH + 20}" text-anchor="middle" fill="#64748B" font-size="10" font-family="monospace">${escapeHtml(String(p.label).slice(0,10))}</text>` : '').join('')}
          ${shapes}
          <line id="chart-crosshair" x1="0" y1="${padT}" x2="0" y2="${padT + plotH}" stroke="#0F172A" stroke-opacity="0.3" stroke-dasharray="3 3" style="display:none;"/>
        </svg>
      `;
    }

    function handleChartHover(e) {
      const ctx = getDataLabContext();
      const pts = ctx.points;
      if (!pts || pts.length < 2) return;
      const svg = document.getElementById('ecolab-chart-svg');
      const rect = svg.getBoundingClientRect();
      const hasSec = pts.some(p => typeof p.secondaryValue === 'number');
      const W = 780, padL = 56, padR = (hasSec && !state.normalizeCompare) ? 56 : 24, plotW = W - padL - padR;
      const relX = ((e.clientX - rect.left) / rect.width) * W;
      const getX = idx => state.chartType === 'bar' ? padL + (plotW / pts.length) * idx + (plotW / pts.length) / 2 : padL + (idx / (pts.length - 1)) * plotW;
      let bestIdx = 0, bestD = Infinity;
      pts.forEach((_, idx) => { const d = Math.abs(getX(idx) - relX); if (d < bestD) { bestD = d; bestIdx = idx; } });
      const pt = pts[bestIdx];
      const line = document.getElementById('chart-crosshair');
      line.setAttribute('x1', getX(bestIdx));
      line.setAttribute('x2', getX(bestIdx));
      line.style.display = 'block';
      const hud = document.getElementById('chart-hover-hud');
      hud.innerHTML = `<strong>${escapeHtml(pt.label)}</strong> · <span style="color:#065F46;font-weight:600;">${fmtNum(pt.value)} ${escapeHtml(ctx.unit)}</span>${typeof pt.secondaryValue === 'number' ? ` · <span style="color:#B45309;font-weight:600;">${fmtNum(pt.secondaryValue)} ${escapeHtml(ctx.secUnit)}</span>` : ''}`;
    }

    function handleCsvUpload(e) {
      const file = e.target.files[0];
      if (!file) return;
      state.csvError = null;
      if (!file.name.toLowerCase().endsWith('.csv')) {
        state.csvError = 'CSV 확장자(.csv) 파일만 업로드할 수 있습니다.';
        renderApp(); return;
      }
      if (file.size > 5 * 1024 * 1024) {
        state.csvError = '파일 크기는 최대 5MB까지 지원합니다.';
        renderApp(); return;
      }
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const parsed = parseCsvText(String(reader.result || ''));
          state.csvFileName = file.name;
          state.csvParsed = parsed;
          state.csvXCol = parsed.headers.find(h => !parsed.numericColumns.includes(h)) || parsed.headers[0];
          state.csvYCol = parsed.numericColumns[0];
          state.csvCompareCol = parsed.numericColumns.length > 1 ? parsed.numericColumns[1] : 'none';
          state.startIdx = 0; state.endIdx = 999;
          state.dataAiStatus = 'idle'; state.dataAiResult = null;
        } catch (err) {
          state.csvParsed = null;
          state.csvError = err.message || 'CSV 파일을 읽을 수 없습니다.';
        }
        renderApp();
      };
      reader.readAsText(file, 'utf-8');
    }

    function downloadSampleCsv() {
      const csv = [
        '월,PM2.5_농도(ug/m3),평균기온(C)',
        '2025-01,29.4,0.8','2025-02,27.1,2.4','2025-03,24.8,7.9','2025-04,20.2,13.6',
        '2025-05,16.5,18.9','2025-06,13.4,23.2','2025-07,10.8,26.8','2025-08,11.2,27.5',
        '2025-09,13.9,22.4','2025-10,17.6,15.8','2025-11,22.3,8.5','2025-12,26.8,2.1'
      ].join('\n');
      const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'ecolab_sample_pm25_temp.csv'; a.click();

    async function runDataAiInterpretation() {
      if (window.location.protocol === 'file:') {
        state.dataAiStatus = 'error';
        state.dataAiError = '로컬 파일(file://) 직접 실행 환경에서는 API 서버가 없어 실시간 AI 해석을 호출할 수 없습니다. (통계·그래프·CSV 분석은 정상 작동합니다.)';
        renderApp(); return;
      }
      const ctx = getDataLabContext();
      const stats = calculateStats(ctx.points);
      state.dataAiStatus = 'loading';
      state.dataAiError = null;
      renderApp();

      try {
        const res = await fetch('/api/ai/analyze-data', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            datasetTitle: ctx.title,
            unit: ctx.unit,
            reliability: ctx.reliability,
            sourceName: ctx.sourceName,
            compareTitle: ctx.secTitle,
            compareUnit: ctx.secUnit,
            stats,
            sampledPoints: ctx.points.slice(0, 40)
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || 'AI 서버 응답 오류');
        state.dataAiResult = data;
        state.dataAiStatus = 'success';
      } catch (err) {
        state.dataAiStatus = 'error';
        state.dataAiError = '실시간 AI 서버와 연결되지 않았습니다. 정적 호스팅(file:// 또는 백엔드 미포함 환경)에서는 AI API 키 보호를 위해 클라이언트 단독 AI 호출을 차단하고 있습니다.';
      }
      renderApp();
    }

    function connectDataToAiLab() {
      const ctx = getDataLabContext();
      const stats = calculateStats(ctx.points);
      state.dataSnapshot = {
        datasetTitle: ctx.title,
        unit: ctx.unit,
        periodLabel: `${ctx.points[0].label} ~ ${ctx.points[ctx.points.length - 1].label}`,
        stats
      };
      state.aiQuery = `"${ctx.title}" 데이터(${state.dataSnapshot.periodLabel}, 평균 ${fmtNum(stats.mean)} ${ctx.unit})의 변화 원인을 과학적으로 설명하고 개선을 위한 친환경 소재와 해결 방안을 제안해 주세요.`;
      navigateTo('ai-lab');
    }

    async function runAiSolution() {
      const q = (state.aiQuery || '').trim();
      if (q.length < 5) {
        state.aiValidationError = '탐구 질문을 5자 이상 구체적으로 입력해 주세요.';
        renderApp(); return;
      }
      if (window.location.protocol === 'file:') {
        state.aiStatus = 'error';
        state.aiError = '로컬 파일(file://) 직접 실행 환경에는 백엔드 API 서버가 없어 실시간 Gemini AI 호출을 실행할 수 없습니다. 환경 탐색, 데이터 분석(CSV 포함), 소재 비교, 연구 노트 기능은 모두 정상 작동합니다.';
        renderApp(); return;
      }
      state.aiValidationError = null;
      state.aiError = null;
      state.aiStatus = 'loading';
      renderApp();

      const topic = ENVIRONMENT_TOPICS.find(t => t.id === state.activeTopicId);
      const mats = ECO_MATERIALS.filter(m => state.comparedMaterialIds.includes(m.id));
      try {
        const res = await fetch('/api/ai/solution', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            query: q,
            difficultyLevel: state.aiDifficulty,
            context: {
              topicTitle: topic ? topic.title : undefined,
              topicSummary: topic ? topic.conceptAndCauses.slice(0, 300) : undefined,
              datasetSummary: state.dataSnapshot ? `${state.dataSnapshot.datasetTitle} (${state.dataSnapshot.periodLabel})` : undefined,
              materialNames: mats.map(m => `${m.nameKo}(${m.nameEn})`)
            }
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || 'AI 응답 오류');
        state.aiReport = {
          id: 'ai_' + Date.now(),
          createdAt: new Date().toISOString(),
          query: q,
          difficultyLevel: state.aiDifficulty,
          sections: data.sections,
          glossary: data.glossary || [],
          verificationNeededNotes: data.verificationNeededNotes || []
        };
        state.aiStatus = 'success';
      } catch (err) {
        state.aiStatus = 'error';
        state.aiError = '실시간 AI 서버와 연결되지 않았습니다. 정적 파일 호스팅(예: 백엔드 없는 Vercel 정적 배포 또는 file://)에서는 API 키 보호를 위해 클라이언트 단독 AI 호출을 수행하지 않습니다.';
      }
      renderApp();
    }

    function addNewEntry(projId) {

      const proj = state.projects.find(p => p.id === projId);
      const ent = proj?.entries.find(e => e.id === entId);
      const chk = ent?.checklist?.find(c => c.id === chkId);

    function exportProjectMd(projId) {
      const proj = state.projects.find(p => p.id === projId);
      if (!proj) return;
      const lines = [`# ${proj.title}`, '', `- 수정일: ${new Date(proj.updatedAt).toLocaleString('ko-KR')}`, '', proj.description || '', '', '---', ''];
      proj.entries.forEach((e, i) => {
        lines.push(`## ${i+1}. ${e.title}`, '', e.content);
        if (e.checklist) { lines.push(''); e.checklist.forEach(c => lines.push(`- [${c.done?'x':' '}] ${c.text}`)); }
        lines.push('');
      });
      const blob = new Blob([lines.join('\n')], { type: 'text/markdown;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = proj.title.replace(/[^\w가-힣-]+/g, '_') + '.md'; a.click();
      URL.revokeObjectURL(url);
    }

    function saveDataToNotebook() {
      const ctx = getDataLabContext();
      const stats = calculateStats(ctx.points);
      const period = `${ctx.points[0].label} ~ ${ctx.points[ctx.points.length - 1].label}`;
      const lines = [
        `출처 구분: ${ctx.reliability === 'sample_demo' ? '[예시 데이터]' : ctx.reliability === 'user_csv' ? '[사용자 CSV]' : '[정적 참고 데이터]'} ${ctx.sourceName}`,
        `분석 구간: ${period} (${stats.count}개 지점)`,
        `평균: ${fmtNum(stats.mean)} ${ctx.unit} | 최댓값: ${fmtNum(stats.max.value)} (${stats.max.label}) | 최솟값: ${fmtNum(stats.min.value)} (${stats.min.label})`,
        `변화율: ${stats.changeRatePercent === null ? '기준값 0' : (stats.changeRatePercent>=0?'+':'') + stats.changeRatePercent.toFixed(1) + '%'}`
      ];
      if (state.dataAiResult) lines.push('', '[AI 경향 해석]', state.dataAiResult.summary, state.dataAiResult.trendInterpretation);
      openSaveEntryModal({ type: 'data_analysis', title: `[데이터 분석] ${ctx.title}`, content: lines.join('\n') }, `${ctx.title} 데이터 분석`, 'climate');
    }

    function saveMaterialComparisonToNotebook() {
      const compared = state.comparedMaterialIds.map(id => ECO_MATERIALS.find(m => m.id === id)).filter(Boolean);
      const cond = MATERIAL_CONDITIONS[state.activeCondition];
      const lines = [
        `비교 조건: ${cond.label}`, '',
        ...compared.map(m => `[${m.nameKo}] 적합성: ${m.suitability[state.activeCondition].fit}\n- 비표면적: ${m.props.specificSurfaceArea}\n- 판단 근거: ${m.suitability[state.activeCondition].rationale}`)
      ];
      openSaveEntryModal({ type: 'material_comparison', title: `[소재 비교] ${compared.map(m=>m.nameKo).join(' · ')}`, content: lines.join('\n') }, `${compared.map(m=>m.nameKo).join(' vs ')} 소재 비교`, 'water');
    }

    function saveAiReportToNotebook() {
      const rep = state.aiReport;
      if (!rep) return;
      const lines = [
        `질문: ${rep.query}`, '',
        '1. 원인 및 배경', rep.sections.causeAndBackground, '',
        '2. 과학 원리', rep.sections.scientificPrinciples, '',
        '3. 친환경 소재 및 기술', ...rep.sections.recommendedMaterialsAndTech.map(m => `- ${m.name}: ${m.mechanism}`), '',
        '4. 적용 한계', ...rep.sections.practicalLimitations.map(l => `- ${l}`), '',
        '5. 추가 실험 아이디어', ...rep.sections.furtherExperiments.map(e => `- ${e}`), '',
        '[추가 검증 필요]', ...rep.verificationNeededNotes.map(n => `- ${n}`)
      ];
      openSaveEntryModal({ type: 'ai_solution', title: `[AI 솔루션] ${rep.query.slice(0, 40)}`, content: lines.join('\n') }, `AI 탐구: ${rep.query.slice(0, 30)}`, 'water');
    }

    function downloadStandaloneIndexHtml() {
      const clone = document.documentElement.cloneNode(true);
      clone.querySelectorAll('script').forEach(sc => {
        const src = sc.getAttribute('src') || '';
        if (src.includes('@vite') || src.includes('/vite/')) sc.remove();
      });
      ['sidebar-nav', 'sidebar-context', 'app-content', 'mobile-bottom-nav', 'modal-root', 'drawer-root', 'toast-root'].forEach(id => {
        const el = clone.querySelector('#' + id);
        if (el) el.innerHTML = '';
      });
      const sb = clone.querySelector('#sidebar');
      if (sb) sb.classList.remove('mobile-open');
      const tbTitle = clone.querySelector('#topbar-title');
      if (tbTitle) tbTitle.textContent = '홈 대시보드';
      const tbSub = clone.querySelector('#topbar-sub');
      if (tbSub) tbSub.textContent = '· Home';
      const tbCta = clone.querySelector('#topbar-cta');
      if (tbCta) tbCta.textContent = 'AI 해결 연구실 열기';

      const html = '<!doctype html>\n' + clone.outerHTML;
      const blob = new Blob([html], { type: 'text/html;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'index.html';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      showToast('GitHub 업로드용 index.html 파일이 다운로드되었습니다.');
    }

    function closeModal() { document.getElementById('modal-root').innerHTML = ''; }

    // =========================================================================
    // 7. MAIN RENDER LOOP
    // =========================================================================
    function renderApp() {
      renderShell();
      const root = document.getElementById('app-content');
      if (state.activeModule === 'home') root.innerHTML = renderHome();
      else if (state.activeModule === 'explorer') root.innerHTML = renderExplorer();
      else if (state.activeModule === 'data-lab') root.innerHTML = renderDataLab();
      else if (state.activeModule === 'materials') root.innerHTML = renderMaterials();
      else if (state.activeModule === 'ai-lab') root.innerHTML = renderAiLab();
      else if (state.activeModule === 'notebook') root.innerHTML = renderNotebook();
    }

    loadProjectsFromStorage();
    renderApp();
  </script>
